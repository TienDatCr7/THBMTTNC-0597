<!DOCTYPE html>
<html lang="en">
<head>
    <title>Playfair Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 700px;
        }
        h2 {
            color: #2c3e50;
            font-family: 'Arial', sans-serif;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }
        .section-title {
            color: #3498db;
            font-weight: bold;
            font-size: 1.5rem;
            margin-bottom: 15px;
        }
        .form-section {
            margin-bottom: 30px;
        }
        .form-control {
            border-radius: 8px;
            transition: border-color 0.3s ease;
        }
        .form-control:focus {
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }
        .btn {
            border-radius: 8px;
            padding: 10px 20px;
            transition: transform 0.2s ease, background-color 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn-primary {
            background-color: #3498db;
            border-color: #3498db;
        }
        .btn-primary:hover {
            background-color: #2980b9;
            border-color: #2980b9;
        }
        .btn-success {
            background-color: #2ecc71;
            border-color: #2ecc71;
        }
        .btn-success:hover {
            background-color: #27ae60;
            border-color: #27ae60;
        }
        .result {
            margin-top: 15px;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>PLAYFAIR CIPHER</h2>
        
        <!-- Encryption Section -->
        <div class="form-section">
            <div class="section-title">ENCRYPTION</div>
            <form method="POST" action="/playfair/encrypt" onsubmit="showResult(event, 'encryptResult')">
                <div class="mb-3">
                    <label class="form-label">Plain text:</label>
                    <input type="text" class="form-control" name="plain_text" placeholder="Input Plain Text" required autofocus/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Key:</label>
                    <input type="text" class="form-control" name="key" placeholder="Input KEY (letters only)" required/>
                </div>
                <button type="submit" class="btn btn-primary">Encrypt</button>
            </form>
            <div id="encryptResult" class="result"></div>
        </div>

        <!-- Decryption Section -->
        <div class="form-section">
            <div class="section-title">DECRYPTION</div>
            <form method="POST" action="/playfair/decrypt" onsubmit="showResult(event, 'decryptResult')">
                <div class="mb-3">
                    <label class="form-label">Cipher text:</label>
                    <input type="text" class="form-control" name="cipher_text" placeholder="Input Cipher Text" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Key:</label>
                    <input type="text" class="form-control" name="key" placeholder="Input KEY (letters only)" required/>
                </div>
                <button type="submit" class="btn btn-success">Decrypt</button>
            </form>
            <div id="decryptResult" class="result"></div>
        </div>
    </div>

    <script>
        async function showResult(event, resultDivId) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            const response = await fetch(form.action, {
                method: 'POST',
                body: formData
            });
            const result = await response.text();
            const resultDiv = document.getElementById(resultDivId);
            resultDiv.innerHTML = result;
            resultDiv.style.display = 'block';
        }
    </script>
</body>
</html>
